apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi